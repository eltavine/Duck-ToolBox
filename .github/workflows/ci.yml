name: CI

# The file name matters: canary update checks read `workflows/ci/main` through nightly.link.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      stable:
        description: Publish the module.prop version as a stable release
        type: boolean
        default: false

permissions:
  contents: read

env:
  MODULE_ID: duck-toolbox
  ANDROID_API_LEVEL: 26
  TARGET: aarch64-linux-android
  NDK_VERSION: r30
  NODE_VERSION: 24
  CARGO_TERM_COLOR: always
  RELEASE_CHANNEL: ${{ inputs.stable && 'stable' || 'nightly' }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  line-limit:
    name: Source line-limit gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fail if any source file exceeds 600 lines
        run: cargo xtask line-limit

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Every feature builds on its own
        run: |
          for feature in rkp rkp-device tee-attestation device-ids tricky-store system; do
            echo "::group::duckd with only ${feature}"
            cargo check --locked --package duckd --no-default-features --features "${feature}"
            echo "::endgroup::"
          done

  android-backend:
    name: Android backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SDK tools for the V1 AIDL bridge
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'build-tools;36.0.0'
      - name: Test the V1 bridge against a host AIDL fixture
        run: python3 scripts/test_rkp_v1_bridge.py
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
      - name: Build backend binary
        env:
          TOOLCHAIN: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin
        run: |
          export CC_aarch64_linux_android="${TOOLCHAIN}/${TARGET}${ANDROID_API_LEVEL}-clang"
          export CXX_aarch64_linux_android="${TOOLCHAIN}/${TARGET}${ANDROID_API_LEVEL}-clang++"
          export AR_aarch64_linux_android="${TOOLCHAIN}/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${CC_aarch64_linux_android}"
          cargo build --locked --release --package duckd --target "${TARGET}"
      - name: Upload backend binary
        uses: actions/upload-artifact@v7
        with:
          name: duckd
          path: target/${{ env.TARGET }}/release/duckd
          if-no-files-found: error

  webui:
    name: WebUI checks and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm (version from packageManager)
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint (includes the 600-line and feature-boundary rules)
        run: pnpm lint
      - run: pnpm format:check
      - name: Unit tests
        run: pnpm test
      - name: Type-check and bundle
        run: pnpm build
      - name: Upload WebUI bundle
        uses: actions/upload-artifact@v7
        with:
          name: webroot
          path: module/webroot
          if-no-files-found: error

  contract:
    name: WebUI contracts against the real backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the host backend
        run: cargo build --locked --package duckd
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      # Every WebUI API call runs through duckctl.sh and duckd and is parsed with the
      # feature's zod schemas, so a changed backend shape fails here.
      - name: Contract tests
        working-directory: ui
        env:
          DUCKD_REQUIRED: "1"
        run: pnpm test:contract

  e2e:
    name: WebUI end-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Playwright against the mock KernelSU host
        run: pnpm test:e2e
      - name: Upload screenshots and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: webui-e2e
          path: |
            ui/test-results
            ui/playwright-report
          retention-days: 14

  module:
    name: Module scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Telegram caption tests
        run: python3 -m unittest discover -s .github/workflows/scripts -p 'test_*.py'
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          SHELLCHECK_OPTS: -s sh
        with:
          scandir: module
      - name: Verify LF line endings
        run: |
          if grep -rlIU $'\r' module; then
            echo "KernelSU module files must use LF line endings." >&2
            exit 1
          fi

  package:
    name: Package module
    runs-on: ubuntu-latest
    needs: [line-limit, rust, android-backend, webui, contract, e2e, module]
    permissions:
      contents: write
    environment: ${{ (github.event_name == 'push' || inputs.stable) && 'Telegram' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download backend binary
        uses: actions/download-artifact@v8
        with:
          name: duckd
          path: artifact/bin
      - name: Download WebUI bundle
        uses: actions/download-artifact@v8
        with:
          name: webroot
          path: module/webroot
      - name: Assemble module
        run: |
          version="$(sed -n 's/^version=//p' module/module.prop)"
          tag=""
          if [ "${RELEASE_CHANNEL}" = stable ]; then
            name="${MODULE_ID}-${version}"
            tag="v${version}"
          else
            code="$(git rev-list --count HEAD)"
            # Canary builds count commits, so every push is newer than the one before.
            sed -i "s/^versionCode=.*/versionCode=${code}/" module/module.prop
            name="${MODULE_ID}-${version}-${code}-canary"
            version="${version} (${code}-canary)"
            sed -i "s/^version=.*/version=${version}/" module/module.prop
          fi
          install -m 0755 artifact/bin/duckd module/bin/duckd
          cp README.md CHANGELOG.md module/
          mkdir -p dist
          (cd module && zip -qr "../dist/${name}.zip" .)
          {
            echo "MODULE_VERSION=${version}"
            echo "RELEASE_TAG=${tag}"
            echo "ARTIFACT_NAME=${name}"
            echo "MODULE_PATH=dist/${name}.zip"
          } >> "$GITHUB_ENV"
      - name: Validate KernelSU Modules metadata and ZIP
        id: validate-module
        uses: KernelSU-Modules/tools/actions/module-release@ca1187c92135b3c31e48d37e008d61153120a08b
        with:
          zip: ${{ env.MODULE_PATH }}
          prerelease: ${{ !inputs.stable }}
          tag: ${{ env.RELEASE_TAG }}
          dry-run: true
      # The artifact is the module directory itself, so its nightly.link zip installs as is.
      - name: Upload module
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: module/
          include-hidden-files: true
          if-no-files-found: error
      - name: Push module zip to Telegram
        if: github.event_name == 'push' || inputs.stable
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          GIT_BRANCH: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
          GITHUB_ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Missing Telegram secrets; skipping upload." >&2
            exit 0
          fi
          caption="$(python3 .github/workflows/scripts/telegram.py build-caption --artifact-path "${MODULE_PATH}")"
          response_file="$(mktemp)"
          http_code=$(curl --silent --show-error --output "${response_file}" --write-out "%{http_code}" \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${MODULE_PATH}" \
            -F "parse_mode=HTML" \
            --form-string "caption=${caption}")
          if [ "${http_code}" != "200" ]; then
            echo "Telegram API returned HTTP ${http_code}." >&2
            cat "${response_file}" >&2
            exit 1
          fi
          python3 .github/workflows/scripts/telegram.py validate-response --response-file "${response_file}"
      - name: Publish release
        if: >-
          ${{ !cancelled() && steps.validate-module.outcome == 'success' &&
              github.ref == 'refs/heads/main' &&
              (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${RELEASE_CHANNEL}" = stable ]; then
            tag="v${MODULE_VERSION}"
            notes_file=CHANGELOG.md
            release_flags=(--latest)
          else
            timestamp="$(python3 -c 'from datetime import datetime, timezone; print(datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%S%fZ"))')"
            tag="nightly-${GITHUB_SHA:0:8}-${timestamp}"
            notes_file="$(mktemp)"
            {
              printf 'Canary module built from commit %s.\n\n' "${GITHUB_SHA}"
              printf 'CI run: %s/%s/actions/runs/%s\n' "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
            } > "${notes_file}"
            release_flags=(--prerelease --latest=false)
          fi
          gh release create "${tag}" "${MODULE_PATH}" \
            --target "${GITHUB_SHA}" \
            --title "${tag}" \
            --notes-file "${notes_file}" \
            "${release_flags[@]}"
