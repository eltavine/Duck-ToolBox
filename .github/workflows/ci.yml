name: CI

# The file name matters: canary update checks read `workflows/ci/main` through nightly.link.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      stable:
        description: Publish the module.prop version as a stable release
        type: boolean
        default: false

permissions:
  contents: read

env:
  ANDROID_API_LEVEL: 26
  TARGET: aarch64-linux-android
  NDK_VERSION: r30
  NODE_VERSION: 24
  CARGO_TERM_COLOR: always
  RELEASE_CHANNEL: ${{ inputs.stable && 'stable' || 'nightly' }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  line-limit:
    name: Source line-limit gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Fail if any source file exceeds 600 lines
        run: cargo xtask line-limit

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Every feature builds on its own
        run: |
          for feature in rkp rkp-device tee-attestation device-ids tricky-store play-integrity device-faker kernel-modules zram linux-env system misc; do
            echo "::group::duckd with only ${feature}"
            cargo check --locked --package duckd --no-default-features --features "${feature}"
            echo "::endgroup::"
          done
      - name: Check the compiled Lite feature catalog
        env:
          DUCK_TOOLBOX_ROOT: ${{ github.workspace }}/module
          DUCK_TOOLBOX_DATA_ROOT: ${{ runner.temp }}/duck-lite
        run: |
          cargo run --quiet --locked --package duckd --no-default-features --features lite -- features \
            | jq -e '.ok and ([.data.features[].id] | sort == ["rkp", "rkp-device", "tricky-store"])'

  play-integrity:
    name: Independent Play Integrity engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'build-tools;37.0.0 ndk;30.0.16248370 cmake;4.1.2'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: components/play-integrity -> ../../target/pif-engine
      - name: Engine format, lint and process tests
        run: |
          cargo fmt --manifest-path components/play-integrity/Cargo.toml --all --check
          cargo clippy --locked --manifest-path components/play-integrity/Cargo.toml --target-dir target/pif-engine --all-targets -- -D warnings
          cargo test --locked --manifest-path components/play-integrity/Cargo.toml --target-dir target/pif-engine
      - name: Native parser, companion and Java value tests
        run: |
          python3 scripts/build-play-integrity.py --dependencies-only
          python3 scripts/test-play-integrity-native.py
          python3 scripts/test-play-integrity-java.py
          python3 scripts/test-play-integrity-scripts.py
          cargo build --locked --manifest-path components/device-faker/manager/Cargo.toml --target-dir target/device-faker-manager
          python3 scripts/test-prop-handler.py
          python3 scripts/test-zygisk-runtime.py
          python3 scripts/test-language-spoof.py
      - name: Engine scripts
        run: shellcheck -s bash --severity=error components/play-integrity/scripts/*.sh
      - name: Build engine and commit-pinned source notice
        run: python3 scripts/build-play-integrity.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: play-integrity
          path: |
            module/play-integrity
            module/zygisk
            module/licenses/play-integrity
            module/licenses/language-spoof

  device-faker:
    name: Embedded Device Faker engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'ndk;30.0.16248370'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: components/device-faker/manager -> ../../../target/device-faker-manager
      - name: Manager format, lint and tests
        run: |
          cargo fmt --manifest-path components/device-faker/manager/Cargo.toml --check
          cargo clippy --locked --manifest-path components/device-faker/manager/Cargo.toml --target-dir target/device-faker-manager --all-targets -- -D warnings
          cargo test --locked --manifest-path components/device-faker/manager/Cargo.toml --target-dir target/device-faker-manager
          python3 scripts/test-device-faker.py
      - name: Build ARM64 native engine and manager
        run: python3 scripts/build-device-faker.py --lint-native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: device-faker
          path: |
            module/device-faker
            module/licenses/device-faker

  android-backend:
    name: Android backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SDK tools for the V1 AIDL bridge
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'build-tools;36.0.0'
      - name: Test the V1 bridge against a host AIDL fixture
        run: python3 scripts/test_rkp_v1_bridge.py
      - name: Setup Android NDK
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ env.TARGET }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build backend binary
        env:
          TOOLCHAIN: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin
        run: |
          export CC_aarch64_linux_android="${TOOLCHAIN}/${TARGET}${ANDROID_API_LEVEL}-clang"
          export CXX_aarch64_linux_android="${TOOLCHAIN}/${TARGET}${ANDROID_API_LEVEL}-clang++"
          export AR_aarch64_linux_android="${TOOLCHAIN}/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${CC_aarch64_linux_android}"
          cargo clippy --locked --package duck-linux-env --all-targets --target "${TARGET}" -- -D warnings
          cargo build --locked --release --package duckd --target "${TARGET}"
          install -D -m 0755 "target/${TARGET}/release/duckd" artifact/full/duckd
          cargo build --locked --release --package duckd --target "${TARGET}" --no-default-features --features lite
          install -D -m 0755 "target/${TARGET}/release/duckd" artifact/lite/duckd
      - name: Upload backend binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: duckd
          path: artifact/
          if-no-files-found: error

  webui:
    name: WebUI checks and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup pnpm (version from packageManager)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint (includes the 600-line and feature-boundary rules)
        run: pnpm lint
      - run: pnpm format:check
      - name: Unit tests
        run: pnpm test
      - name: Type-check and bundle
        env:
          VITE_PIF_SOURCE_COMMIT: ${{ github.sha }}
          VITE_DEVICE_FAKER_SOURCE_COMMIT: ${{ github.sha }}
        run: pnpm build
      - name: Bundle Lite WebUI
        run: pnpm build --mode lite
      - name: Upload WebUI bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: webroot
          path: module/webroot
          if-no-files-found: error
      - name: Upload Lite WebUI bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: webroot-lite
          path: target/lite/webroot
          if-no-files-found: error

  contract:
    name: WebUI contracts against the real backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build the host backend
        run: |
          cargo build --locked --package duckd
          cargo build --locked --manifest-path components/play-integrity/Cargo.toml --target-dir target/pif-engine
          cargo build --locked --manifest-path components/device-faker/manager/Cargo.toml --target-dir target/device-faker-manager
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      # Every WebUI API call runs through duckctl.sh and duckd and is parsed with the
      # feature's zod schemas, so a changed backend shape fails here.
      - name: Contract tests
        working-directory: ui
        env:
          DUCKD_REQUIRED: "1"
        run: pnpm test:contract

  e2e:
    name: WebUI end-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Playwright against the mock KernelSU host
        run: pnpm test:e2e
      - name: Upload screenshots and report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: webui-e2e
          path: |
            ui/test-results
            ui/playwright-report
          retention-days: 14

  module:
    name: Module scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/supply_chain/requirements.txt
      - name: Install locked SBOM validators
        run: python3 -m pip install --require-hashes -r scripts/supply_chain/requirements.txt
      - name: Supply-chain inventory and release tests
        run: python3 -m unittest discover -s scripts/supply_chain -p 'test_*.py'
      - name: Telegram notification tests
        run: python3 -m unittest discover -s .github/workflows/scripts -p 'test_*.py'
      - name: Installer platform and API guards
        run: |
          python3 scripts/test-module-install.py
          python3 scripts/test-device-faker.py
      - name: Corresponding-source checkout guards
        run: python3 scripts/test-play-integrity-package.py
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        env:
          SHELLCHECK_OPTS: -s sh
        with:
          scandir: module
      - name: Verify LF line endings
        run: |
          if grep -rlIU $'\r' module; then
            echo "KernelSU module files must use LF line endings." >&2
            exit 1
          fi

  package:
    name: Package module
    runs-on: ubuntu-latest
    needs: [line-limit, rust, android-backend, play-integrity, device-faker, webui, contract, e2e, module]
    outputs:
      artifact-name: ${{ steps.assemble.outputs.artifact-name }}
      module-file: ${{ steps.assemble.outputs.module-file }}
      sbom-file: ${{ steps.assemble.outputs.sbom-file }}
      lite-module-file: ${{ steps.assemble.outputs.lite-module-file }}
      lite-sbom-file: ${{ steps.assemble.outputs.lite-sbom-file }}
      module-version: ${{ steps.assemble.outputs.module-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Download backend binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: duckd
          path: artifact/bin
      - name: Download WebUI bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: webroot
          path: module/webroot
      - name: Download Lite WebUI bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: webroot-lite
          path: artifact/webroot-lite
      - name: Download independent engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: play-integrity
          path: module
      - name: Download Device Faker engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: device-faker
          path: module
      - name: Assemble module
        id: assemble
        run: |
          version="$(sed -n 's/^version=//p' module/module.prop)"
          tag=""
          if [ "${RELEASE_CHANNEL}" = stable ]; then
            tag="v${version}"
          else
            code="$(git rev-list --count HEAD)"
            # Canary builds count commits, so every push is newer than the one before.
            version="${version} (${code}-canary)"
          fi
          # Keep the release ZIPs and their inventory records isolated by edition.
          full="$(python3 scripts/package-module.py --binary artifact/bin/full/duckd --channel "${RELEASE_CHANNEL}" --output-dir dist/full)"
          lite="$(python3 scripts/package-module.py --variant lite --binary artifact/bin/lite/duckd --webroot artifact/webroot-lite --channel "${RELEASE_CHANNEL}" --output-dir dist/lite)"
          name="${full##*/}"
          name="${name%.zip}"
          lite_name="${lite##*/}"
          lite_name="${lite_name%.zip}"
          {
            echo "MODULE_VERSION=${version}"
            echo "RELEASE_TAG=${tag}"
            echo "ARTIFACT_NAME=${name}"
            echo "MODULE_PATH=dist/full/${name}.zip"
            echo "LITE_MODULE_PATH=dist/lite/${lite_name}.zip"
          } >> "$GITHUB_ENV"
          {
            echo "artifact-name=${name}-verified"
            echo "module-file=${name}.zip"
            echo "sbom-file=${name}.spdx.json"
            echo "lite-module-file=${lite_name}.zip"
            echo "lite-sbom-file=${lite_name}.spdx.json"
            echo "module-version=${version}"
          } >> "$GITHUB_OUTPUT"
      - name: Validate KernelSU Modules metadata and ZIP
        id: validate-module
        uses: KernelSU-Modules/tools/actions/module-release@ca1187c92135b3c31e48d37e008d61153120a08b
        with:
          zip: ${{ env.MODULE_PATH }}
          prerelease: ${{ !inputs.stable }}
          tag: ${{ env.RELEASE_TAG }}
          dry-run: true
      - name: Validate Lite ZIP
        uses: KernelSU-Modules/tools/actions/module-release@ca1187c92135b3c31e48d37e008d61153120a08b
        with:
          zip: ${{ env.LITE_MODULE_PATH }}
          # The repository's catalog manifest registers Full only.
          manifest: target/lite/module.yaml
          dry-run: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/supply_chain/requirements.txt
      - name: Install locked SBOM validators
        run: python3 -m pip install --require-hashes -r scripts/supply_chain/requirements.txt
      - name: Install pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0
      - name: Generate and validate both module SBOMs
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          python3 scripts/supply_chain/sbom.py --archive "${MODULE_PATH}" --syft "${SYFT}" --commit "${GITHUB_SHA}"
          python3 scripts/supply_chain/sbom.py --variant lite --archive "${LITE_MODULE_PATH}" --syft "${SYFT}" --commit "${GITHUB_SHA}"
      # The artifact is the module directory itself, so its nightly.link zip installs as is.
      - name: Upload module
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: module/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload exact release ZIP and SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.assemble.outputs.artifact-name }}
          path: dist/
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Attest and publish module
    timeout-minutes: 15
    needs: package
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    environment: Telegram
    env:
      MODULE_PATH: dist/full/${{ needs.package.outputs.module-file }}
      LITE_MODULE_PATH: dist/lite/${{ needs.package.outputs.lite-module-file }}
      MODULE_VERSION: ${{ needs.package.outputs.module-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.package.outputs.artifact-name }}
          path: dist
      - name: Check release input hashes and source commit
        run: python3 scripts/supply_chain/release.py --check-only
      - name: Attest module build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ env.MODULE_PATH }}
            dist/full/${{ needs.package.outputs.sbom-file }}
          create-storage-record: false
      - name: Attest module SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ env.MODULE_PATH }}
          sbom-path: dist/full/${{ needs.package.outputs.sbom-file }}
          create-storage-record: false
      - name: Attest Lite build provenance
        id: lite-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ env.LITE_MODULE_PATH }}
            dist/lite/${{ needs.package.outputs.lite-sbom-file }}
          create-storage-record: false
      - name: Attest Lite SBOM
        id: lite-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ env.LITE_MODULE_PATH }}
          sbom-path: dist/lite/${{ needs.package.outputs.lite-sbom-file }}
          create-storage-record: false
      - name: Verify attestations and publish complete release
        id: publish-release
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
          LITE_PROVENANCE_BUNDLE: ${{ steps.lite-provenance.outputs.bundle-path }}
          LITE_SBOM_BUNDLE: ${{ steps.lite-sbom.outputs.bundle-path }}
        run: >-
          python3 scripts/supply_chain/release.py
          --provenance "${PROVENANCE_BUNDLE}" --sbom-bundle "${SBOM_BUNDLE}"
          --lite-provenance "${LITE_PROVENANCE_BUNDLE}" --lite-sbom-bundle "${LITE_SBOM_BUNDLE}"
          --channel "${RELEASE_CHANNEL}"
      - name: Notify Telegram with module or release link
        if: steps.publish-release.outcome == 'success' && (github.event_name == 'push' || inputs.stable)
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          GIT_BRANCH: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
          GITHUB_ACTION_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_ASSET_URL: ${{ steps.publish-release.outputs.asset-url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 .github/workflows/scripts/telegram.py send \
            --artifact-path "${MODULE_PATH}" \
            --release-asset-url "${RELEASE_ASSET_URL}"
