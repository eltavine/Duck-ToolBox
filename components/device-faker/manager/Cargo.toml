[package]
name = "device-faker-engine"
version = "1.6.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
libc = "0.2.191"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.1.8", features = ["parse", "preserve_order"] }
indexmap = { version = "2.14.2", features = ["serde"] }
sha2 = "0.11.1"
tempfile = "3.27.0"

[dev-dependencies]
jni = { version = "0.22.4", default-features = false }
log = "0.4.35"

[profile.release]
lto = true
strip = true
codegen-units = 1
