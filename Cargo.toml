[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.3-stable"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/eltavine/Duck-ToolBox"
publish = false

[workspace.dependencies]
duck-core = { path = "crates/duck-core" }
duck-platform = { path = "crates/duck-platform" }
duck-rkp = { path = "crates/duck-rkp" }
duck-rkp-device = { path = "crates/duck-rkp-device" }
duck-tee-attestation = { path = "crates/duck-tee-attestation" }
duck-device-ids = { path = "crates/duck-device-ids" }
duck-system = { path = "crates/duck-system" }
duck-tricky-store = { path = "crates/duck-tricky-store" }

aes = "0.9.3"
aes-gcm = "0.11.1"
anyhow = "1.0.104"
base64ct = { version = "1.8.3", features = ["alloc"] }
ciborium = "0.2.2"
clap = { version = "4.6.7", features = ["derive"] }
cmac = "0.8.0"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
libc = "0.2.189"
libloading = "0.9.0"
p256 = { version = "0.14.0", features = ["arithmetic", "ecdh", "ecdsa", "pem", "pkcs8"] }
p384 = { version = "0.14.0", features = ["ecdsa"] }
pkcs8 = { version = "0.11.0", features = ["pem"] }
quick-xml = "0.42.0"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "crypto", "pem"] }
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
toml = "1.1.6"
toml_edit = "0.25.15"
webpki-roots = "1.0.9"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
x509-cert = "0.3.0"
zeroize = { version = "1.9.0", features = ["derive"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
strip = true
